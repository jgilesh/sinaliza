<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sinaliza · Dicionário de Libras</title>
  <meta name="description" content="Digite uma palavra e veja o sinal em Libras na hora.">
  <meta name="theme-color" content="#4f3870" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1624" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sinaliza">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/search.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="Sinaliza, início">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="80 130 352 252"><circle cx="206" cy="256" r="100" stroke="#c0623f" stroke-width="44"/><circle cx="306" cy="256" r="100" stroke="#fff" stroke-width="44"/><path d="M188.6 157.5A100 100 0 0 1 292.6 206" stroke="#c0623f" stroke-width="44" stroke-linecap="butt"/></svg>
        </span>
        <span class="brand-text">Sinaliza</span>
      </a>
      <div class="searchbox">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input id="q" type="search" placeholder="Buscar sinal" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Buscar sinal" aria-describedby="status" aria-controls="alts feature">
        <button id="clear" class="clear" type="button" aria-label="Limpar busca" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <kbd class="kbd-hint" aria-hidden="true">/</kbd>
      </div>
    </div>
  </header>

  <main>
    <h1 class="sr-only">Dicionário de Libras</h1>
    <nav class="tabs" aria-label="Seções">
      <a class="tab" href="#/" data-view="sinais">Sinais</a>
      <a class="tab" href="#/frases" data-view="frases">Frases</a>
      <a class="tab" href="#/montar" data-view="montar">Monte uma frase</a>
      <a class="tab" href="#/favoritos" data-view="favoritos">Favoritos</a>
    </nav>
    <div id="cats" class="cats" role="group" aria-label="Categorias"></div>
    <div id="classes" class="cats classes" role="group" aria-label="Classes de palavras"></div>
    <section id="page" hidden></section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="announce" class="sr-only" aria-live="polite"></p>
    <nav id="alts" aria-label="Outros resultados" hidden></nav>
    <section id="feature" aria-label="Sinal"></section>
    <section id="results" aria-busy="true">
      <div class="grid"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div>
    </section>
  </main>

  <footer class="foot">
    <p id="foot-note">Demo</p>
  </footer>

  <noscript><p class="noscript">Ative o JavaScript para usar o dicionário.</p></noscript>
</body>
</html>
