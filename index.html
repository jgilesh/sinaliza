<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sinais · Dicionário de Libras</title>
  <meta name="description" content="Digite uma palavra e veja o sinal em Libras na hora.">
  <meta name="theme-color" content="#2453d6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sinais">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/search.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="Sinais, início">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 12V5.5a1.5 1.5 0 0 1 3 0V11M10 10.5V4a1.5 1.5 0 0 1 3 0v6.5M13 10.5V5a1.5 1.5 0 0 1 3 0v6M16 11V8a1.5 1.5 0 0 1 3 0v5.5a7.5 7.5 0 0 1-7.5 7.5h-.7a6 6 0 0 1-4.7-2.3L3.6 15.4a1.6 1.6 0 0 1 2.5-2L7 14.5"/></svg>
        </span>
        <span class="brand-text">Sinais</span>
      </a>
      <div class="searchbox">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input id="q" type="search" placeholder="Buscar sinal… (sem acento)" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Buscar sinal" aria-describedby="status" aria-controls="alts feature">
        <button id="clear" class="clear" type="button" aria-label="Limpar busca" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <kbd class="kbd-hint" aria-hidden="true">/</kbd>
      </div>
    </div>
  </header>

  <main>
    <h1 class="sr-only">Dicionário de Libras</h1>
    <div id="cats" class="cats" role="group" aria-label="Categorias"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="announce" class="sr-only" aria-live="polite"></p>
    <nav id="alts" aria-label="Outros resultados" hidden></nav>
    <section id="feature" aria-label="Sinal"></section>
    <section id="results" aria-busy="true">
      <div class="grid"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div>
    </section>
  </main>

  <footer class="foot">
    <p id="foot-note">Demo</p>
  </footer>

  <noscript><p class="noscript">Ative o JavaScript para usar o dicionário.</p></noscript>
</body>
</html>
